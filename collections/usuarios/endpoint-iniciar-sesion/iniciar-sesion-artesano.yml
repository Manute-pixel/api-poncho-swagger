info:
  name: iniciar-sesion-artesano
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/usuarios/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{emailArtesanoPedro}}",
        "password": "{{claveArtesanoPedro}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
