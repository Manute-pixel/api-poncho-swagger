info:
  name: ya-existe-dni
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/usuarios/registro-artesano"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombre": "Pedro",
        "apellido": "Gonzales",
        "email": "example@gmail.com",
        "password": "{{claveArtesanoNuevo}}",
        "dni": "40123456",
        "fechaNac": "2000-05-15",
        "telefono": "3834123456",
        "rubroId": 3,
        "localidadId": 4,
        "provinciaId": 5
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
