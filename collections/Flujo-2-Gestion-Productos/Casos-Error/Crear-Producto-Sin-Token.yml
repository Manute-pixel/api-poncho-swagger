info:
  name: Crear-Producto-Sin-Token
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/productos/crear-mi-producto
  body:
    type: json
    data: |-
      {
        "nombre": "Poncho catamarqueño",
        "descripcion": "Poncho artesanal tejido a mano con lana de oveja y diseños tradicionales.",
        "precio": 85000.50,
        "categoriaId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
